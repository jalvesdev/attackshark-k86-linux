[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attackshark-k86-hid"
version = "0.1.0"
description = "Read-only Fedora HID transport and protocol codecs for ATTACK SHARK K86"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["hidapi>=0.14"]

[project.scripts]
k86-hid = "attackshark_k86.cli:main"

[tool.setuptools.packages.find]
include = ["attackshark_k86*"]
